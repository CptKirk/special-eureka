---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: custom-headers
  namespace: chat-demo
spec:
  headers:
    contentTypeNosniff: true
    stsSeconds: 31536000
    forceSTSHeader: true
    customResponseHeaders:
      Server: ""
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: chat-demo-ingress
  namespace: chat-demo
  annotations:
    cert-manager.io/issuer: chat-demo-issuer
    traefik.ingress.kubernetes.io/router.middlewares: chat-demo-custom-headers@kubernetescrd
spec:
  tls:
  - hosts:
      - kfuks.chat-demo.devel.techcast.cloud
    secretName: chat-demo-ingress-cert
  rules:
  - host: kfuks.chat-demo.devel.techcast.cloud
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend
            port:
              name: http
      - path: /rta
        pathType: Prefix
        backend:
          service:
            name: backend
            port:
              name: http
        