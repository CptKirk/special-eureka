apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: valkey
  namespace: flux-system
spec:
  interval: 1h
  url: https://valkey.io/valkey-helm/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: valkey
  namespace: flux-system
spec:
  interval: 15m
  targetNamespace: chat-demo
  chart:
    spec:
      chart: valkey
      version: '0.9.*'
      sourceRef:
        kind: HelmRepository
        name: valkey
        namespace: flux-system
      interval: 1h