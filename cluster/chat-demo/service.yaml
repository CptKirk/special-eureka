apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: chat-demo
spec:
  selector:
    app: backend
  ports:
  - name: http
    protocol: TCP
    port: 3000
    targetPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: chat-demo
spec:
  selector:
    app: frontend
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 80
