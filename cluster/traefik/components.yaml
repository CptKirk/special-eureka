apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 1h
  url: https://traefik.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: flux-system
spec:
  interval: 15m
  targetNamespace: traefik
  install:
    createNamespace: true
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: traefik
      version: '36.2.*'
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: flux-system
      interval: 1h
  values:
    deployment:
      replicas: 1
    autoscaling:
      enabled: false
    resources:
      requests:
        cpu: "500m"
        memory: "500Mi"
      limits:
        memory: "500Mi"
    service:
      enabled: true
      type: LoadBalancer
      spec:
        loadBalancerIP: 51.158.130.79
---
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: default
  namespace: traefik
spec:
  sniStrict: false
  minVersion: VersionTLS12
  curvePreferences:
  - "X25519"
  - "CurveP256"
  - "CurveP384"
  cipherSuites:
  - "TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305"
  - "TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305"
  - "TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384"
  - "TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384"
  - "TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256"
  - "TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256"